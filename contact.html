<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
</head>
<body>
  <!--Skip Link for Keyboard Users-->
    <a href="#main-content" class="skip-link">Skip to Main content</a>
    
    <!--Header Section-->
    <header>
        <h1>Lord Of the Recipes</h1>
        <!--Navigation Links-->
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/home.html">Home</a></li>
                <li><a href="/recipes.html">Recipes</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <!--Main Content-->
    <main id="main-content" tabindex="-1">
        <!--Tab to edit-->
        <section aria-labelledby="contact-us">
            <h2 id="contact-us">Contact Us</h2>
            <form action="/contact" method="POST">
                <!-- Personal Info -->
                <fieldset>
                    <legend>Personal Info</legend>
                    <label for="fullname">Full Name <span aria-hidden="true">*</span></label>
                    <input type="text" name="fullname" id="fullname" required aria-required="true" placeholder="Your Full Name" autocomplete="name">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input type="email" name="email" id="email" required aria-required="true" placeholder="Your Email" autocomplete="email">
                    <label for="phoneno">Phone No</label>
                    <input type="tel" name="phoneno" id="phoneno" placeholder="Your Phone No" autocomplete="tel">
                </fieldset>
                <!-- Your Message -->
                <fieldset>
                    <legend>Your Message</legend>
                    <label for="subject">Subject</label>
                    <select name="subject" id="subject">
                        <option value="">Select Subject</option>
                        <option value="general">General</option>
                        <option value="recipe-request">Recipe Request</option>
                        <option value="feedback">Feedback</option>
                        <option value="report-issue">Report Issue</option>
                    </select>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" cols="30" rows="4" required aria-required="true" minlength="20" placeholder="Your Message"></textarea>
                    <label for="reference">How did you hear about us?</label>
                    <input type="text" name="reference" id="reference" list="reference-list" placeholder="Select">
                    <datalist id="reference-list">
                        <option value="Facebook">Facebook</option>
                        <option value="Reference Link">Reference Link</option>
                        <option value="Surfing the Internet">Surfing the Internet</option>
                        <option value="Others">Others</option>
                    </datalist>
                </fieldset>
                <!-- Contact Preferences-->
                <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <!-- radio buttons to chose contact method -->
                    <label><input type="radio" name="contact-method" value="contact-email" /> Email</label>
                    <label><input type="radio" name="contact-method" value="contact-phone" /> Phone</label>
                </fieldset>
                <!-- Newsletter Subscription  -->
                <fieldset>
                    <legend>Newsletter</legend>
                    <label><input type="checkbox" name="newsletter" value="subscribe">Subscribe to newsletter</label>
                </fieldset>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <!--Footer Section-->
    <footer>
        <nav aria-label="Footer navigation">
            <ul>
                <li><a href="/privacy-policy.html">Privacy Policy</a></li>
                <li><a href="/terms-conditions.html">Terms and Conditions</a></li>
            </ul>
        </nav>
        <p><small>&copy; 2026 Lord Of the Recipes</small></p>
    </footer>
</body>
</html>
